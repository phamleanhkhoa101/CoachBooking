name: coachbooking

services:
  db:
    image: postgres:16-alpine
    container_name: coachbooking-db
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB:-coachbooking}
      POSTGRES_USER: ${POSTGRES_USER:-coachbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachbooking}
    volumes:
      - coachbooking-db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coachbooking} -d ${POSTGRES_DB:-coachbooking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: coachbooking-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-coachbooking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-coachbooking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coachbooking}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      SEPAY_ENABLED: ${SEPAY_ENABLED:-false}
      SEPAY_ENVIRONMENT: ${SEPAY_ENVIRONMENT:-sandbox}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_IPN_SECRET: ${SEPAY_IPN_SECRET:-}
      SEPAY_FRONTEND_URL: ${SEPAY_FRONTEND_URL:-}
      SEPAY_CONFIRMATION_MODE: ${SEPAY_CONFIRMATION_MODE:-IPN}
      SEPAY_LOCAL_RETURN_URL: ${SEPAY_LOCAL_RETURN_URL:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      APP_JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8080}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@coachbooking.local}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-CoachBooking}
      APP_SWAGGER_ENABLED: ${APP_SWAGGER_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      APP_OAUTH2_REDIRECT_URI: ${APP_OAUTH2_REDIRECT_URI:-http://localhost:3000/oauth2/callback}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: coachbooking-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  frontend-admin:
    build: ./frontend
    container_name: coachbooking-frontend-admin
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3001}:80"

volumes:
  coachbooking-db-data:
