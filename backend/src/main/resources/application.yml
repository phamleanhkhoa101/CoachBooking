server:
  port: 8080

spring:
  application:
    name: qlbxmd-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qlbxmd}
    username: ${SPRING_DATASOURCE_USERNAME:qlbxmd}
    password: ${SPRING_DATASOURCE_PASSWORD:qlbxmd}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:qlbxmd-dev-secret-key-change-me-in-production-2026}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
