server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: coachbooking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coachbooking}
    username: ${SPRING_DATASOURCE_USERNAME:coachbooking}
    password: ${SPRING_DATASOURCE_PASSWORD:coachbooking}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
    # Volume tạo bởi bộ script db/init cũ (trước khi dùng Flyway) được đánh dấu
    # đã ở phiên bản 2 để không chạy lại V1/V2 trên dữ liệu đang có.
    baseline-on-migrate: true
    baseline-version: 2
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${APP_JWT_SECRET:coachbooking-dev-secret-key-change-me-in-production-2026}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@coachbooking.local}
    from-name: ${APP_MAIL_FROM_NAME:CoachBooking}
  password-reset:
    expiration-minutes: ${APP_RESET_EXPIRATION_MINUTES:15}
    cooldown-seconds: ${APP_RESET_COOLDOWN_SECONDS:60}
    max-attempts: ${APP_RESET_MAX_ATTEMPTS:5}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
