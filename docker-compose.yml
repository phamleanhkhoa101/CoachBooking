name: coachbooking

services:
  db:
    image: postgres:16-alpine
    container_name: coachbooking-db
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${POSTGRES_DB:-coachbooking}
      POSTGRES_USER: ${POSTGRES_USER:-coachbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachbooking}
    volumes:
      - coachbooking-db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coachbooking} -d ${POSTGRES_DB:-coachbooking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: coachbooking-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-coachbooking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-coachbooking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-coachbooking}
      APP_JWT_SECRET: ${JWT_SECRET:-coachbooking-dev-secret-key-change-me-in-production-2026}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: coachbooking-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  frontend-admin:
    build: ./frontend
    container_name: coachbooking-frontend-admin
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3001}:80"

volumes:
  coachbooking-db-data:
