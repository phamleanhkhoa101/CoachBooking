server:
  port: 8080

spring:
  application:
    name: coachbooking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coachbooking}
    username: ${SPRING_DATASOURCE_USERNAME:coachbooking}
    password: ${SPRING_DATASOURCE_PASSWORD:coachbooking}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    locations: classpath:db/migration
    # Volume tạo bởi bộ script db/init cũ (trước khi dùng Flyway) được đánh dấu
    # đã ở phiên bản 2 để không chạy lại V1/V2 trên dữ liệu đang có.
    baseline-on-migrate: true
    baseline-version: 2
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:coachbooking-dev-secret-key-change-me-in-production-2026}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health
